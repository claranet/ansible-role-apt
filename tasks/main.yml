---
- name: "Installing required packages"
  ansible.builtin.apt:
    pkg: "{{ _apt_required_packages }}"
    state: present
    cache_valid_time: "{{ apt_cache_valid_time }}"

- name: "Ensure directory structure exists"
  ansible.builtin.file:
    path: "/{{ item.path }}"
    state: directory
    mode: "0755"
  with_community.general.filetree: "../templates"  # noqa: deprecated-bare-vars
  when: item.state == "directory"

- name: "Ensure files are populated from templates"
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "/{{ item.path }}"
    mode: '0444'
  with_community.general.filetree: "../templates"  # noqa: deprecated-bare-vars
  when:
    - item.state == "file"

- name: "Manage apt repositories"
  ansible.builtin.deb822_repository:
    name: "{{ item.name | default(item.urls | first | urlsplit('hostname')) }}"
    types: "{{ item.types | default(['deb']) }}"
    uris: "{{ item.urls }}"
    suites: "{{ item.suites }}"
    components: "{{ item.components }}"
    architectures: "{{ item.architectures | default(omit) }}"
    signed_by: "{{ item.key | default(omit) }}"
  when:
    - not apt_keys
    - apt_repositories | trim | length > 0
  loop: "{{ apt_repositories }}"
  loop_control:
    label: "{{ item.urls | join(' ') if item.urls is not string else item.urls }}"

- name: "Adding ppa repositories"
  ansible.builtin.apt_repository:
    repo: "{{ item.repo }}"
    codename: "{{ item.codename | default(omit) }}"
    update_cache: true
  loop: "{{ apt_ppas }}"
  loop_control:
    label: "{{ item.repo }}"
  when: item.repo is defined

- name: "Upgrading system"
  become: true
  ansible.builtin.apt:
    upgrade: "{{ apt_upgrade }}"
    update_cache: true
    autoremove: "{{ apt_autoremove }}"
  when: apt_upgrade

- name: "Installing packages"
  become: true
  ansible.builtin.apt:
    name: "{{ apt_packages }}"
    state: present
    autoremove: "{{ apt_autoremove }}"
    force: "{{ apt_force }}"
    dpkg_options: "{{ apt_dpkg_options | default(omit) }}"
    install_recommends: "{{ apt_install_recommends }}"
    default_release: "{{ apt_default_release | default(omit) }}"
    cache_valid_time: "{{ apt_cache_valid_time }}"
    update_cache: "{{ item.update_cache | default(true) }}"

- name: "Un-Installing packages"
  become: true
  ansible.builtin.apt:
    name: "{{ apt_packages_remove }}"
    state: absent
    autoremove: "{{ apt_autoremove }}"
    force: "{{ apt_force }}"
    dpkg_options: "{{ apt_dpkg_options | default(omit) }}"
    install_recommends: "{{ apt_install_recommends }}"
    default_release: "{{ apt_default_release | default(omit) }}"
    cache_valid_time: "{{ apt_cache_valid_time }}"
    update_cache: "{{ item.update_cache | default(true) }}"

- name: "Package unattended-upgrades"
  ansible.builtin.apt:
    name: unattended-upgrades
    state: >-
      {%- if apt_config_unattended_upgrades_package_state == 'auto' -%}
      {{- (_apt_config_.APT.Periodic['Unattended-Upgrade'] == 1) | ternary('present', 'absent') -}}
      {%- else -%}
      {{- apt_config_unattended_upgrades_package_state -}}
      {%- endif -%}
    cache_valid_time: "{{ apt_cache_valid_time }}"

- name: "Package apt-listchanges"
  ansible.builtin.apt:
    name: apt-listchanges
    state: >-
      {%- if apt_config_listchanges_package_state == 'auto' -%}
      {{- (apt_config_listchanges_mail is not none) | ternary('present', 'absent') -}}
      {%- else -%}
      {{- apt_config_listchanges_package_state -}}
      {%- endif -%}
    cache_valid_time: "{{ apt_cache_valid_time }}"
